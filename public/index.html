<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Поток</title>
  <!-- Без запрета масштаба WebView Telegram принимает быстрые двойные
       касания (лайк, листание фото) за «увеличить». -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f1f2f6">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <link rel="stylesheet" href="css/app.css">
  <!-- Заставка оформлена здесь, чтобы быть видной с первого кадра, пока
       грузятся стили и модули. -->
  <style>
    .splash {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: var(--tg-theme-secondary-bg-color, #f1f2f6);
      color: var(--tg-theme-text-color, #0f1419);
      font: 800 30px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.03em;
      transition: opacity .3s ease;
    }
    .splash.gone { opacity: 0; pointer-events: none; }
    .splash-mark {
      width: 72px; height: 72px; border-radius: 20px;
      box-shadow: 0 0 0 1px rgba(15, 20, 25, .08), 0 10px 28px rgba(15, 20, 25, .14);
      animation: splash-pulse 1.4s ease-in-out infinite;
    }
    .splash-mark svg { display: block; }
    .mk-p { stroke-dasharray: 80; stroke-dashoffset: 80; animation: splash-draw .7s .25s cubic-bezier(.6,0,.2,1) forwards; } .mk-dot { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: dot-pop .35s cubic-bezier(.3,1.6,.5,1) forwards; } .mk-dot2 { animation-delay: .1s; } @keyframes dot-pop { to { transform: scale(1); } }
    @keyframes splash-draw { to { stroke-dashoffset: 0; } }
    @keyframes splash-pulse { 50% { transform: scale(.94); } }
    @media (prefers-color-scheme: dark) {
      .splash { background: var(--tg-theme-secondary-bg-color, #0e0f12); color: var(--tg-theme-text-color, #f2f3f5); }
    }
  </style>
</head>
<body>
  <div class="splash"><div class="splash-mark"><svg viewBox="0 0 64 64" width="72" height="72"><rect width="64" height="64" rx="18" fill="#fff"/><circle class="mk-dot" cx="16" cy="25" r="4.6" fill="#0f1419"/><circle class="mk-dot mk-dot2" cx="16" cy="40.5" r="4.6" fill="#0f1419"/><path class="mk-p" d="M27.5 47V18.5h21V47" fill="none" stroke="#0f1419" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Поток</div>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
