name = "potok"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Страница приложения. Файлы из public отдаются напрямую, мимо кода
# воркера; до кода доходят только адреса, которых среди файлов нет:
# /api/*, /img/*, /tg.
[assets]
directory = "./public"
binding = "ASSETS"

# Уборка раз в час: фото, не попавшие в пост, и уведомления старше 60 дней.
[triggers]
crons = ["17 * * * *"]

[vars]
# Модераторы — id в Telegram через запятую. Узнать свой: @userinfobot.
ADMIN_IDS = ""
# Имя бота без @ и короткое имя мини-приложения из BotFather (/newapp):
# из них собираются ссылки «поделиться постом» вида t.me/бот/приложение.
BOT_USERNAME = ""
APP_NAME = ""
# Адрес приложения для кнопок в сообщениях бота. Пусто — адрес воркера.
APP_URL = ""
# Канал-склад для фото вручную (id вида -100…). Обычно не нужен: бот
# запоминает канал сам, когда модератор добавляет его туда администратором.
MEDIA_CHAT_ID = ""

# Токен бота не лежит в файлах. Его кладёт сценарий выкладки
# (.github/workflows/deploy.yml) или вручную: npx wrangler secret put BOT_TOKEN
# Секрет вебхука выводится из токена сам; задать свой — WEBHOOK_SECRET.

[[d1_databases]]
binding = "DB"
database_name = "potok"
# Заменить на id из вывода `npx wrangler d1 create potok`.
database_id = "00000000-0000-0000-0000-000000000000"

# Фото по умолчанию хранятся в Telegram: создайте закрытый канал и добавьте
# туда бота администратором — бот сам запомнит канал и напишет вам.
# Если есть зарубежная карта и хочется хранить фото у Cloudflare —
# раскомментируйте R2 (бакет: `npx wrangler r2 bucket create potok-media`).
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "potok-media"
